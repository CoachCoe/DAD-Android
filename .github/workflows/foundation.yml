name: Mobile foundation checks
# Push runs only on the integration branches; a PR branch is checked once, by its pull_request run.
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: [self-hosted, dad, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/check-foundation.mjs
      - run: node --test scripts/check-foundation.test.mjs
      - name: Foundation drift (advisory)
        run: node scripts/check-foundation-drift.mjs
      - run: node --test scripts/check-foundation-drift.test.mjs
  android:
    # Stays GitHub-hosted: boots an x86_64 emulator that needs Linux KVM
    # (`/dev/kvm`), which the self-hosted Apple Silicon Mac cannot provide
    # (no KVM, and the x86_64 system image will not run under HVF). Move this
    # to a self-hosted Linux host with KVM to go fully self-hosted.
    runs-on: ubuntu-24.04
    # The emulator suite takes about 19 minutes on the hosted runner; leave headroom so a slow boot
    # is not mistaken for a failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: echo '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "platforms;android-37.0" "build-tools;36.0.0" "system-images;android-35;google_apis;x86_64"'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:lintRelease --warning-mode all
      - name: Test Compose journeys and Keystore on Android
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/dad-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name dad-foundation --path "$ANDROID_AVD_HOME/dad-foundation.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx dad-foundation
          "$ANDROID_HOME/emulator/emulator" -avd dad-foundation -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          if ! timeout 120 adb wait-for-device; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          # Boot gate. sys.boot_completed alone is not enough: the journeys type into fields and wait
          # (awaitKeyboardSettled) for the soft keyboard's inset to settle, so the IME framework must be
          # up before tests start. On a slow/cold hosted runner the IME can register seconds after
          # boot_completed, and a test that types in that window times out (ComposeTimeoutException in
          # awaitKeyboardSettled). So wait for, in order: boot_completed, the package manager answering,
          # and a default IME registered AND listed as enabled. Poll on real conditions, never a blind sleep.
          wait_for() { # <description> <command that prints a non-empty value when ready>
            for _ in $(seq 1 120); do
              if [ -n "$(eval "$2" 2>/dev/null | tr -d '\r')" ]; then return 0; fi
              sleep 2
            done
            echo "timed out waiting for $1"; cat "$RUNNER_TEMP/emulator.log"; return 1
          }
          wait_for "boot_completed" "adb shell getprop sys.boot_completed | grep -w 1" || exit 1
          wait_for "package manager" "adb shell pm path android | grep package:" || exit 1
          wait_for "default IME registered" "adb shell settings get secure default_input_method | grep -v '^null$'" || exit 1
          wait_for "default IME enabled" "adb shell ime list -s | grep ." || exit 1
          adb shell input keyevent 82
          # The journeys deliberately exercise controls above the software keyboard.
          adb shell settings put secure show_ime_with_hard_keyboard 1
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global "$scale" 0; done
          ./gradlew :app:connectedDebugAndroidTest
      - name: Name failing instrumentation tests
        if: always()
        run: |
          shopt -s nullglob
          for f in app/build/outputs/androidTest-results/connected/debug/TEST-*.xml app/build/outputs/androidTest-results/connected/*/TEST-*.xml; do
            awk -v file="$f" '/<testcase /{name=$0} /<failure|<error/{print "FAILED: " name " (" file ")"}' "$f"
          done
          true
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: androidtest-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
